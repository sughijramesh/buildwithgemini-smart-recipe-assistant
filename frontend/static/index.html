<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Pantry & Recipe Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --accent: #059669;
    --accent-dark: #047857;
    --accent-light: #ecfdf5;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --log-bg: #fafafa;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --radius-lg: 16px;
    --radius-md: 12px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
  }

  body.dark-mode {
    --bg: #0f172a;
    --card-bg: #1e293b;
    --log-bg: #0f172a;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: #334155;
    --accent-light: #064e3b;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    align-items: center;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .app-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 860px;
    height: 100vh;
    background: var(--card-bg);
    box-shadow: var(--shadow-lg);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  header {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #ffffff;
    padding: 0.9rem 1.4rem;
    font-weight: 700;
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(5, 150, 105, 0.15);
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .header-badge {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(4px);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.25rem 0.6rem;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: #34d399;
    border-radius: 50%;
    display: inline-block;
  }

  .theme-toggle-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: #ffffff;
    padding: 0.35rem 0.65rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    transition: all 0.2s ease;
  }

  .theme-toggle-btn:hover {
    background: rgba(255, 255, 255, 0.35);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    background: var(--log-bg);
    transition: background 0.3s ease;
  }

  .msg-row {
    display: flex;
    gap: 0.75rem;
    max-width: 85%;
    align-items: flex-start;
    animation: fadeInUp 0.25s ease-out forwards;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-row.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }

  .msg-row.agent .avatar {
    background: var(--accent-light);
    border: 1px solid #d1fae5;
    color: var(--accent);
  }

  .msg-row.user .avatar {
    background: var(--accent);
    color: #ffffff;
  }

  .bubble-container {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .sender-name {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-left: 0.2rem;
  }

  .msg-row.user .sender-name {
    text-align: right;
    margin-right: 0.2rem;
  }

  .bubble {
    padding: 0.85rem 1.1rem;
    border-radius: var(--radius-lg);
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--text-main);
    white-space: pre-wrap;
    word-break: break-word;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .msg-row.user .bubble {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #ffffff;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: 0 3px 10px rgba(5, 150, 105, 0.2);
  }

  .msg-row.agent .bubble {
    border-top-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    white-space: normal;
  }

  /* Animated 3-dot typing pulse */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0.4rem 0.2rem;
  }
  .typing-indicator span {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: typingPulse 1.4s infinite ease-in-out both;
  }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typingPulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  #prompts {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem 1.25rem;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  #prompts::-webkit-scrollbar { display: none; }

  .prompt-btn {
    background: var(--accent-light);
    color: var(--accent-dark);
    border: 1px solid #a7f3d0;
    padding: 0.45rem 0.9rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  body.dark-mode .prompt-btn {
    border-color: #065f46;
    color: #6ee7b7;
  }

  .prompt-btn:hover {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
  }

  form {
    display: flex;
    gap: 0.6rem;
    padding: 1rem 1.25rem;
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    align-items: center;
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 24px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
    background: var(--bg);
    color: var(--text-main);
  }

  input:focus {
    background: var(--card-bg);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
  }

  .icon-btn {
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--bg);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .icon-btn:hover {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent);
  }

  .icon-btn.recording {
    background: #ef4444;
    color: #ffffff;
    border-color: #ef4444;
    animation: pulseMic 1s infinite alternate;
  }

  @keyframes pulseMic {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
  }

  button.send-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 3px 8px rgba(5, 150, 105, 0.25);
    flex-shrink: 0;
  }

  button.send-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(5, 150, 105, 0.35);
  }

  /* Image Lightbox Overlay */
  .lightbox-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(5px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .lightbox-modal.active { display: flex; }
  .lightbox-modal img { max-width: 90%; max-height: 90vh; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .lightbox-close {
    position: absolute; top: 1.5rem; right: 2rem;
    color: #fff; font-size: 2rem; cursor: pointer; font-weight: 700;
  }

  /* --- A2UI Component Styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.2rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; color: var(--text-main); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-main); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-main); }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: var(--shadow-sm); cursor: pointer; transition: transform 0.2s ease; }
  .a2img:hover { transform: scale(1.02); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<div class="app-container">
  <header>
    <div class="header-brand">
      <span>🥗</span>
      <span>Smart Pantry & Recipe Concierge</span>
    </div>
    <div class="header-controls">
      <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel">Dark</span>
      </button>
      <div class="header-badge">
        <span class="status-dot"></span>
        <span>Online</span>
      </div>
    </div>
  </header>

  <div id="log"></div>

  <div id="prompts">
    <button type="button" class="prompt-btn" onclick="sendPrompt('Find healthy dinner recipes')">🥗 Find healthy dinner recipes</button>
    <button type="button" class="prompt-btn" onclick="sendPrompt('Generate image for avocado toast')">📸 Generate image for avocado toast</button>
    <button type="button" class="prompt-btn" onclick="sendPrompt('Find nearby supermarkets')">🛒 Find nearby supermarkets</button>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask about recipes, ingredients, or pantry items..." autocomplete="off" autofocus>
    <button type="button" class="icon-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice input (Hands-free kitchen mode)">
      <span class="material-symbols-outlined">mic</span>
    </button>
    <button type="submit" class="send-btn" title="Send message">
      <span class="material-symbols-outlined" style="color:#ffffff; font-size:1.3rem;">send</span>
    </button>
  </form>
</div>

<!-- Image Lightbox Modal -->
<div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img id="lightboxImg" src="" alt="Full Resolution Preview">
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const themeBtn = document.getElementById("themeBtn");
const themeIcon = document.getElementById("themeIcon");
const themeLabel = document.getElementById("themeLabel");
const micBtn = document.getElementById("micBtn");
const lightboxModal = document.getElementById("lightboxModal");
const lightboxImg = document.getElementById("lightboxImg");

function toggleTheme() {
  document.body.classList.toggle("dark-mode");
  const isDark = document.body.classList.contains("dark-mode");
  themeIcon.textContent = isDark ? "☀️" : "🌙";
  themeLabel.textContent = isDark ? "Light" : "Dark";
}

function openLightbox(src) {
  lightboxImg.src = src;
  lightboxModal.classList.add("active");
}
function closeLightbox() {
  lightboxModal.classList.remove("active");
}

let recognition = null;
let isRecording = false;

function toggleVoiceInput() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Speech recognition is not supported in this browser. Please try Chrome or Edge.");
    return;
  }
  if (!recognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-US";

    recognition.onstart = () => {
      isRecording = true;
      micBtn.classList.add("recording");
    };
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      input.value = transcript;
      sendPrompt(transcript);
    };
    recognition.onerror = () => {
      stopVoiceInput();
    };
    recognition.onend = () => {
      stopVoiceInput();
    };
  }

  if (isRecording) {
    recognition.stop();
  } else {
    recognition.start();
  }
}

function stopVoiceInput() {
  isRecording = false;
  micBtn.classList.remove("recording");
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "🥗");
  const container = el("div", "bubble-container");
  const name = el("div", "sender-name", who === "user" ? "You" : "Recipe Concierge");
  const b = el("div", "bubble");
  
  container.appendChild(name);
  container.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(container);
  
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTypingIndicator() {
  const row = el("div", "msg-row agent");
  const avatar = el("div", "avatar", "🥗");
  const container = el("div", "bubble-container");
  const name = el("div", "sender-name", "Recipe Concierge");
  const b = el("div", "bubble");
  
  const typing = el("div", "typing-indicator");
  typing.appendChild(el("span"));
  typing.appendChild(el("span"));
  typing.appendChild(el("span"));
  b.appendChild(typing);

  container.appendChild(name);
  container.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(container);

  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return { row, b };
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || "";
      img.onclick = () => openLightbox(src);
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  
  const typing = showTypingIndicator();
  const b = typing.b;

  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
